<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Charles D. Cayetano - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b2f4d"/>
      <stop offset="1" stop-color="#0e75b6"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e75b6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e75b6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9be8ff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>

  <style>
    .name  { font: 800 46px 'Segoe UI', Arial, Helvetica, sans-serif; fill: url(#txt); letter-spacing: 3px; animation: rise 1.2s ease-out both; }
    .role  { font: 600 22px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #00d4ff; letter-spacing: 6px; animation: rise 1.2s 0.4s ease-out both; }
    .stack { font: 500 15px 'Courier New', monospace; fill: #cfe9f7; animation: rise 1.2s 0.8s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- floating particles -->
    <g fill="#00d4ff">
      <circle cx="80"  cy="240" r="3" opacity="0.5"><animate attributeName="cy" from="250" to="-10" dur="9s"  repeatCount="indefinite"/></circle>
      <circle cx="190" cy="240" r="2" opacity="0.4"><animate attributeName="cy" from="250" to="-10" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="240" r="4" opacity="0.3"><animate attributeName="cy" from="250" to="-10" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="240" r="2" opacity="0.5"><animate attributeName="cy" from="250" to="-10" dur="13s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="240" r="3" opacity="0.4"><animate attributeName="cy" from="250" to="-10" dur="11s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="240" r="4" opacity="0.3"><animate attributeName="cy" from="250" to="-10" dur="14s" begin="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="240" r="2" opacity="0.5"><animate attributeName="cy" from="250" to="-10" dur="9s"  begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="240" r="3" opacity="0.4"><animate attributeName="cy" from="250" to="-10" dur="12s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moving waves -->
    <path fill="url(#w2)" d="M0,215 Q125,185 250,215 T500,215 T750,215 T1000,215 T1250,215 T1500,215 T1750,215 T2000,215 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" d="M0,225 Q125,197 250,225 T500,225 T750,225 T1000,225 T1250,225 T1500,225 T1750,225 T2000,225 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <text class="name"  x="500" y="105" text-anchor="middle">CHARLES D. CAYETANO</text>
    <text class="role"  x="500" y="145" text-anchor="middle">FULL-STACK DEVELOPER</text>
    <text class="stack" x="500" y="185" text-anchor="middle">PHP • Laravel • Vue • TypeScript • React • Next • MySQL • Postgres</text>
  </g>
</svg>
